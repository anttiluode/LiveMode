[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "livemode-experiment"
version = "0.1.0"
description = "Continuous read/write operator-memory laboratory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
transformer = ["torch>=2.2", "transformers>=4.45"]

[tool.setuptools.packages.find]
include = ["live_mode*"]
